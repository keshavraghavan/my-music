services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mymusic
      POSTGRES_USER: mymusic
      POSTGRES_PASSWORD: mymusic
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mymusic -d mymusic']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mymusic-postgres:/var/lib/postgresql/data

volumes:
  mymusic-postgres:
